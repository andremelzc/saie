# Organización y Proyecto (según repo)
sonar.projectKey=andremelzc_saie
sonar.organization=andremelzc

# Rutas de código fuente y pruebas (Monorepo)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

# Rutas a los reportes de cobertura (generados por Jest con --coverage)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Exclusiones de código (no evaluar tests ni dependencias en la cobertura de fuentes)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/coverage/**,backend/prisma/**

# Esperar el resultado del Quality Gate en el CI (Issue 5.10b)
sonar.qualitygate.wait=true
