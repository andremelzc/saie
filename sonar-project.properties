# Organización y Proyecto (según repo)
sonar.projectKey=andremelzc_saie
sonar.organization=andremelzc

# Rutas de código fuente y pruebas (Monorepo)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Rutas a los reportes de cobertura (generados por Jest con --coverage)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Exclusiones de código (no evaluar tests, dependencias ni demos/bootstrap en la cobertura de fuentes - Issue #268)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/coverage/**,backend/prisma/**,frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/test/**,frontend/src/components/mapa3d/demo/**
# Exclusiones de cobertura con justificación (Issue 5.22 / #268):
# - main.tsx, App.tsx, test/**, demo/**: bootstrap y páginas de prueba
# - Escena.tsx: componente gráfico 3D Three.js/WebGL sobre GPU, no ejecutable en JSDOM sin GPU
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/test/**,frontend/src/components/mapa3d/demo/**,frontend/src/components/mapa3d/Escena.tsx,**/*.test.ts,**/*.test.tsx

# Esperar el resultado del Quality Gate en el CI (Issue 5.10b)
sonar.qualitygate.wait=true
