name: CD

# Despliegue continuo hacia Supabase, Render y Vercel (cumple los criterios
# de aceptación del Issue 1.10). Se dispara solo tras el merge a develop y
# únicamente despliega si el CI (ci.yml) pasa.
on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # Puerta de calidad: reutiliza ci.yml sobre el mismo commit del push
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Un workflow reutilizable no hereda los secrets: sin esto SONAR_TOKEN
    # llega vacío y el análisis de SonarCloud falla, bloqueando el despliegue
    secrets: inherit

  deploy:
    name: Despliegue continuo (CD)
    runs-on: ubuntu-latest
    needs: ci
    # Evita que dos despliegues (y sus migraciones) corran a la vez
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias (backend + frontend, workspaces)
        run: npm ci

      - name: Aplicar migraciones en Supabase (conexión directa)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run prisma:deploy --workspace=backend

      - name: Disparar despliegue del Backend en Render
        run: |
          echo "Disparando deploy hook de Render..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Desplegar Frontend en Vercel (CLI)
        # El Root Directory del proyecto en Vercel es `frontend`,
        # por eso los comandos corren desde la raíz del repo.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verificar salud del Backend (Issue 5.24)
        # Tolerar el arranque en frío de Render (45 a 60 s): hasta 24 intentos cada 5 s.
        # Un 200 en /api/health confirma que la acción sí se ejecutó correctamente.
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "${BACKEND_URL}" ]; then
            echo "::error::Falta el secreto BACKEND_URL (URL pública del backend, sin barra final)."
            exit 1
          fi
          for intento in $(seq 1 24); do
            if curl -fsS --max-time 90 "${BACKEND_URL}/api/health"; then
              echo ""
              echo "Backend disponible tras ${intento} intento(s)."
              exit 0
            fi
            echo "Intento ${intento}/24: el backend aún no responde; reintentando en 5 s..."
            sleep 5
          done
          echo "::error::El backend no respondió al health check tras el despliegue."
          exit 1

      - name: Verificar salud del Frontend (Issue 5.24)
        # Requiere el secreto FRONTEND_URL (documentado en el README, sección 9.4).
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          if [ -z "${FRONTEND_URL}" ]; then
            echo "::warning::FRONTEND_URL no está configurado; se omite la verificación del frontend."
            exit 0
          fi
          for intento in $(seq 1 12); do
            if curl -fsS --max-time 30 "${FRONTEND_URL}" > /dev/null; then
              echo "Frontend disponible tras ${intento} intento(s)."
              exit 0
            fi
            echo "Intento ${intento}/12: el frontend aún no responde; reintentando en 5 s..."
            sleep 5
          done
          echo "::error::El frontend no respondió al health check tras el despliegue."
          exit 1
