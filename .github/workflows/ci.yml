name: CI

# Se dispara en cada push y en cada Pull Request hacia develop o main
# (cumple el primer criterio de aceptación del Issue 5.10a)
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # Job 1: lint y formato — no necesita base de datos, corre rápido
  lint-and-format:
    name: Lint y formato
    runs-on: ubuntu-latest

    # prisma generate no se conecta a ninguna base real en este job,
    # pero prisma.config.ts necesita que la variable exista para poder
    # resolver el archivo de configuración. Un valor de relleno alcanza.
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saie_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/saie_dev?schema=public

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'   # caché de dependencias

      - name: Instalar dependencias (backend + frontend, workspaces)
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace=backend

      - name: Ejecutar linter (ESLint)
        run: npm run lint

      - name: Verificar formato (Prettier)
        run: npm run format:check

  # Job 2: pruebas unitarias y parametrizadas, contra una base PostgreSQL
  # de servicio (igual a docker-compose.yml), preparando el terreno para
  # cuando se sumen las pruebas de integración (Issue 5.7).
  unit-tests:
    name: Pruebas unitarias y parametrizadas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saie_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/saie_dev?schema=public

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'   # caché de dependencias

      - name: Instalar dependencias (backend + frontend, workspaces)
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace=backend

      - name: Ejecutar pruebas unitarias y parametrizadas
        # Nota: este workflow es la base del Issue 5.10a.
        # El Issue 5.10b (Sprint 3) añade aquí los quality gates
        # de cobertura ≥85% y 0 bugs críticos vía SonarCloud.
        run: npm run test

  # Job 3: Despliegue continuo hacia Supabase, Render y Vercel
  # Solo corre en la rama principal (develop) tras pasar los checks previos
  # (cumple los criterios de aceptación del Issue 1.10)
  deploy:
    name: Despliegue continuo (CD)
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias (backend + frontend, workspaces)
        run: npm ci

      - name: Aplicar migraciones en Supabase (conexión directa)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Disparar despliegue del Backend en Render
        run: |
          echo "Disparando deploy hook de Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Disparar despliegue del Frontend en Vercel
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "Disparando deploy hook de Vercel..."
            curl -f -X POST "$VERCEL_HOOK"
          else
            echo "VERCEL_DEPLOY_HOOK_URL no configurado, omitiendo llamada a Vercel."
          fi